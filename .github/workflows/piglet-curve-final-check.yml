name: Piglet curve final check

on:
  push:
    branches:
      - age-dependent-piglet-growth

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run src/lib/sim/preweaning.test.ts src/lib/calibration.test.ts src/lib/engine/planning/forecast.test.ts src/lib/sim/growth-from-feed.test.ts src/lib/sim/mortality.test.ts src/lib/sim/farm.test.ts
