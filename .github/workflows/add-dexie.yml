name: Add Dexie dependency

on:
  push:
    branches:
      - interactive-pedigree-graph
    paths:
      - .github/workflows/add-dexie.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: interactive-pedigree-graph
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install dexie@^4.2.1 --save
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Dexie for simulation cache"
          git push origin HEAD:interactive-pedigree-graph
